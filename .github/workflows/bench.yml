name: Bench

# Perf-regression gate for the hot paths in src/core/*.bench.ts. Mirrors
# scripts/bench-guard.sh's local pre-push hook (same script, scripts/bench-assert.ts):
# a same-job, back-to-back comparison of two refs, NOT a comparison against a
# historical cross-run baseline (that style of tool, e.g.
# benchmark-action/github-action-benchmark, needs a very loose threshold — its own
# default is 200% — to survive GitHub's shared-runner timing variance across separate
# jobs/days). Checking out both refs into the same job and benchmarking back-to-back
# removes that cross-run noise, so a tight threshold is trustworthy.
#
# Runs at RELEASE time, not on every PR: `on: push: tags: v*` — the tag Changesets
# pushes (release.yml, `changeset publish`) the moment a version is actually
# delivered, comparing it against the previous v* tag. Explicit choice, not the
# default `on: pull_request`: this job builds+benches TWO full checkouts, real
# GitHub Actions runner minutes on every PR for a check the local pre-push hook
# (scripts/bench-guard.sh, same comparison logic, same scripts/bench-hot-paths.regex
# filter) already runs for free on the contributor's own machine before every push.
# `bench` is intentionally NOT a required PR status check for this same reason (see
# the "required check" note below) — a bad PR isn't blocked by CI here, it's caught
# by the local hook before it's even pushed, with this job as the release-time
# backstop that recomputes the comparison independently from the real published
# artifact.
#
# release.yml's tag push uses a real PAT (`RELEASE_GITHUB_TOKEN`), not the default
# GITHUB_TOKEN — GitHub doesn't trigger other workflows from a push authenticated by
# the default token (an infinite-loop guard), so this tag-push trigger genuinely
# fires; see release.yml's own comment for the same reasoning applied to its
# "Version Packages" PR checks.
#
# IMPORTANT if you ever add `bench` back to main's required PR status checks
# (`gh api repos/.../branches/main/protection`): a required check must report a
# completed status on every PR commit, or that PR becomes permanently unmergeable —
# a required check that only runs at release time (this file, as written) would
# silently break every future PR. Confirmed the hard way: an earlier version of this
# workflow was `workflow_dispatch`-only while `bench` was STILL listed as a required
# check from a previous repo-settings change, which would have blocked every future
# merge. Fixed by removing `bench` from required checks (this workflow's own PR) —
# keep both of those decisions in sync if either changes again.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base ref to compare against (default: the previous v* tag)'
        required: false
        type: string
      head_ref:
        description: 'Head ref to bench (default: the commit that triggered this run)'
        required: false
        type: string

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      # Full history AND tags (actions/checkout's default `fetch-tags: true` under
      # `fetch-depth: 0`) — the ref-resolution step below needs the full v* tag list
      # to find "the previous release," not just whatever ref triggered this run.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve base/head refs
        id: refs
        run: |
          HEAD_REF="${{ inputs.head_ref }}"
          if [ -z "$HEAD_REF" ]; then
            HEAD_REF="${{ github.event_name == 'push' && github.ref_name || github.sha }}"
          fi
          BASE_REF="${{ inputs.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            # The most recent v* tag OTHER than head itself — not simply "the tag
            # before this commit" by date, since `git tag --sort=-v:refname` sorts by
            # SEMVER, matching how a release is actually ordered (a hotfix tag pushed
            # out of chronological order still compares against the right predecessor).
            BASE_REF="$(git tag --sort=-v:refname --list 'v*' | grep -vx "$HEAD_REF" | head -n1)"
          fi
          if [ -z "$BASE_REF" ]; then
            echo "No previous v* tag to compare against (first release?) — nothing to bench."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Comparing $BASE_REF (base) -> $HEAD_REF (head)"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
      - name: Checkout base ref
        if: steps.refs.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.refs.outputs.base_ref }}
          path: base
      - name: Checkout head ref
        if: steps.refs.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.refs.outputs.head_ref }}
          path: head
      # Explicit version, not autodetected from a root package.json's `packageManager`
      # field: base/ and head/ are checked out into subdirectories (needed so both
      # refs coexist in the same job), so there's no package.json at the workspace
      # root for pnpm/action-setup's own autodetection to find (confirmed by a real
      # CI failure: "No pnpm version is specified... in the package.json with the key
      # packageManager" — package.json exists, just one level down from where the
      # action looks by default).
      - if: steps.refs.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - if: steps.refs.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            base/pnpm-lock.yaml
            head/pnpm-lock.yaml
      # `vitest bench` exits 1 (not 0) when a ref has zero *.bench.ts files — real the
      # first time this workflow compares a pre-bench-suite tag against a later one.
      # It still writes a valid (empty) --outputJson report before exiting, so
      # `|| true` here + failing only if that file is actually missing distinguishes
      # "ran, found nothing" from "the command itself never completed."
      # bench-assert.ts's own comparedCount===0 check (see that script) is what
      # actually judges whether an empty/partial comparison is acceptable — this step
      # just has to not crash the job outright either way.
      #
      # Also builds each ref and times the ACTUAL dist/cli.js — scripts/bench-cli-startup.ts
      # (process/module-loading startup only) and scripts/bench-cli-check.ts (a real
      # `check` run against a realistic fixture, the one thing that actually exercises
      # the CheckPlugin registry dispatch — see that script's own header for why none
      # of src/core/*.bench.ts or CheckSummaries.bench.ts do), both appended into the
      # same report — src/core/*.bench.ts alone only exercises source-level functions
      # via vitest's own esbuild transform, never the real tsc + esbuild-bundle build
      # toolchain, so a regression introduced there (e.g. a `typescript` or `esbuild`
      # devDependency bump) would otherwise be invisible to this gate.
      #
      # An older tag may not have these scripts yet — both timings use HEAD's own
      # copy (already the pattern for the final assert step below), invoked from each
      # ref's own directory so dist/cli.js resolves to that ref's own build.
      - name: Bench base ref
        if: steps.refs.outputs.skip != 'true'
        working-directory: base
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest bench --run --outputJson "$RUNNER_TEMP/before.json" || true
          test -f "$RUNNER_TEMP/before.json" || { echo "vitest bench produced no report for the base ref"; exit 1; }
          pnpm build
          pnpm exec tsx ../head/scripts/bench-cli-startup.ts "$RUNNER_TEMP/before.json"
          pnpm exec tsx ../head/scripts/bench-cli-check.ts "$RUNNER_TEMP/before.json"
      - name: Bench head ref
        if: steps.refs.outputs.skip != 'true'
        working-directory: head
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest bench --run --outputJson "$RUNNER_TEMP/after.json" || true
          test -f "$RUNNER_TEMP/after.json" || { echo "vitest bench produced no report for the head ref"; exit 1; }
          pnpm build
          pnpm exec tsx scripts/bench-cli-startup.ts "$RUNNER_TEMP/after.json"
          pnpm exec tsx scripts/bench-cli-check.ts "$RUNNER_TEMP/after.json"
      - name: Assert no regression
        if: steps.refs.outputs.skip != 'true'
        working-directory: head
        run: pnpm exec tsx scripts/bench-assert.ts "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json"
