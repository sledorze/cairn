name: Bench

# Perf-regression gate for the hot paths in src/core/*.bench.ts. Mirrors
# scripts/bench-guard.sh's local pre-push hook (same script, scripts/bench-assert.ts):
# a same-job, back-to-back comparison of the PR's base ref against its head, NOT a
# comparison against a historical cross-run baseline (that style of tool, e.g.
# benchmark-action/github-action-benchmark, needs a very loose threshold — its own
# default is 200% — to survive GitHub's shared-runner timing variance across separate
# jobs/days). Checking out both refs into the same job and benchmarking back-to-back
# removes that cross-run noise, so a tight threshold is trustworthy.
#
# This is the ONLY non-fakeable check: the local pre-push hook is convenience/fast
# feedback, but its "pass" can't be trusted on its own — it's skippable
# (--no-verify), and a contributor working from a fork may never have installed it.
# CI recomputing the comparison independently, from the actual pushed commits, is
# what makes this evidence trustworthy rather than a self-reported claim.
#
# NOTE: running here does not yet BLOCK a bad merge — that requires this job
# ("bench") to be added to the repo's branch protection required status checks
# (currently only "build-test" is required). That's a separate, explicit repo-settings
# change, not bundled into this workflow file.
#
# Manual-only (workflow_dispatch), not `on: pull_request` — explicit request: this
# job builds+benches TWO full checkouts (base and head) on every PR, which costs real
# GitHub Actions runner minutes for a check the local pre-push hook
# (scripts/bench-guard.sh, same comparison logic) already runs for free on the
# contributor's own machine before every push. Run this manually (Actions tab ->
# "Bench" -> "Run workflow") when you specifically want CI's independent
# confirmation, e.g. before merging a PR whose author skipped the local hook — pass
# the PR's head branch/SHA as `head_ref`; `base_ref` defaults to `main`. Explicit
# inputs, not `github.event.pull_request.*`: that context is only populated on a
# real `pull_request` event, empty on `workflow_dispatch` — using it here unchanged
# would have shipped a manual trigger that fails the instant anyone actually ran it.
on:
  workflow_dispatch:
    inputs:
      base_ref:
        default: main
        description: 'Base ref to compare against (branch, tag, or SHA)'
        required: false
        type: string
      head_ref:
        description: "Head ref to bench (branch, tag, or SHA) — typically a PR's head branch"
        required: true
        type: string

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_ref }}
          path: base
      - name: Checkout head ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_ref }}
          path: head
      # Explicit version, not autodetected from a root package.json's `packageManager`
      # field: base/ and head/ are checked out into subdirectories (needed so both
      # refs coexist in the same job), so there's no package.json at the workspace
      # root for pnpm/action-setup's own autodetection to find (confirmed by a real
      # CI failure: "No pnpm version is specified... in the package.json with the key
      # packageManager" — package.json exists, just one level down from where the
      # action looks by default).
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            base/pnpm-lock.yaml
            head/pnpm-lock.yaml
      # `vitest bench` exits 1 (not 0) when a ref has zero *.bench.ts files — real for
      # THIS PR specifically, since it's the one introducing the bench suite, so the
      # base ref (main, pre-merge) legitimately has none yet. It still writes a valid
      # (empty) --outputJson report before exiting, so `|| true` here + failing only
      # if that file is actually missing distinguishes "ran, found nothing" from "the
      # command itself never completed." bench-assert.ts's own comparedCount===0 check
      # (see that script) is what actually judges whether an empty/partial comparison
      # is acceptable — this step just has to not crash the job outright either way.
      #
      # Also builds each ref and times the ACTUAL dist/cli.js — scripts/bench-cli-startup.ts
      # (process/module-loading startup only) and scripts/bench-cli-check.ts (a real
      # `check` run against a realistic fixture, the one thing that actually exercises
      # the CheckPlugin registry dispatch — see that script's own header for why none
      # of src/core/*.bench.ts or CheckSummaries.bench.ts do), both appended into the
      # same report — src/core/*.bench.ts alone only exercises source-level functions
      # via vitest's own esbuild transform, never the real tsc + esbuild-bundle build
      # toolchain, so a regression introduced there (e.g. a `typescript` or `esbuild`
      # devDependency bump) would otherwise be invisible to this gate. Confirmed
      # directly: `bench` reported clean on a TypeScript major-version-bump PR despite
      # never invoking tsc.
      #
      # base/ won't have these scripts yet in the PR that introduces each (same
      # bootstrapping situation as the *.bench.ts files) — both timings use head's copy
      # (already the pattern for the final assert step below), invoked from each ref's
      # own directory so dist/cli.js resolves to that ref's own build.
      - name: Bench base ref
        working-directory: base
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest bench --run --outputJson "$RUNNER_TEMP/before.json" || true
          test -f "$RUNNER_TEMP/before.json" || { echo "vitest bench produced no report for the base ref"; exit 1; }
          pnpm build
          pnpm exec tsx ../head/scripts/bench-cli-startup.ts "$RUNNER_TEMP/before.json"
          pnpm exec tsx ../head/scripts/bench-cli-check.ts "$RUNNER_TEMP/before.json"
      - name: Bench head ref
        working-directory: head
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest bench --run --outputJson "$RUNNER_TEMP/after.json" || true
          test -f "$RUNNER_TEMP/after.json" || { echo "vitest bench produced no report for the head ref"; exit 1; }
          pnpm build
          pnpm exec tsx scripts/bench-cli-startup.ts "$RUNNER_TEMP/after.json"
          pnpm exec tsx scripts/bench-cli-check.ts "$RUNNER_TEMP/after.json"
      - name: Assert no regression
        working-directory: head
        run: pnpm exec tsx scripts/bench-assert.ts "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json"
