name: Release

# Automated changesets flow (see AGENTS.md for the `pnpm changeset` convention):
#  - on push to main with unconsumed .changeset/*.md files, opens/updates a "Version
#    Packages" PR (bumped package.json, generated CHANGELOG.md) — reviewable like any
#    other PR, and gets the SAME build-test/bench/CodeQL checks as any other PR (see the
#    GITHUB_TOKEN note below for why that isn't automatic).
#  - merging that PR re-triggers this workflow; changesets/action detects the version
#    bump and runs `pnpm release` (changeset publish), which publishes to npm, pushes
#    the git tag, and creates a GitHub Release from the changelog — all three of which
#    the previous hand-rolled version of this workflow silently didn't do (confirmed:
#    v0.1.0 was published with no pushed tag and no Release; see PR that introduced
#    this workflow for the full investigation).
# workflow_dispatch kept as a manual fallback (e.g. to retry after a transient publish
# failure); with nothing new to release, changeset publish is a clean no-op.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.repository == 'sledorze/cairn'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance (see publishConfig.provenance)
    steps:
      - uses: actions/checkout@v7
        with:
          # Ensure the GITHUB_TOKEN below (not whatever checkout would persist by
          # default) is what git operations actually use.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # NOT `registry-url: 'https://registry.npmjs.org'`: passing it makes
          # setup-node write its own temp .npmrc keyed to `NODE_AUTH_TOKEN` and point
          # `NPM_CONFIG_USERCONFIG` at it — which, against changesets/action v1,
          # silently shadowed the separate .npmrc IT wrote from `NPM_TOKEN` below, for
          # every subsequent npm/pnpm invocation in this job (including the actual
          # `npm publish` inside `changeset publish`). Confirmed via a real failed
          # run at the time: publish went out unauthenticated (the shadowing file's
          # `${NODE_AUTH_TOKEN}` placeholder never resolves, since only `NPM_TOKEN`
          # was set), and npm returned a misleading `404 Not Found` instead of a
          # permission error (its documented behaviour for an unauthenticated request
          # against a package that DOES already exist on the registry). Whether v2
          # still writes its own `.npmrc` from `NPM_TOKEN` the same way is no longer
          # confirmed (see the `env.NPM_TOKEN` comment below) — but avoiding
          # `registry-url` here stays the right call either way: it only ever
          # introduces a SECOND, competing auth-config source, never a needed one.
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # Pinned to the exact tag, not a floating major (`@v1`/`@v2`): confirmed directly
      # against the action repo's real tags — it has no floating major tag at all, only
      # exact versions (v1.0.0..v1.9.0 stable, v2.0.0-next.* prereleases, now also a
      # real v2.x stable line starting at v2.0.0/v2.1.0 — re-checked as of this pin).
      # `@v2` (what this was first written with, based on a since-corrected assumption)
      # failed with "unable to find version v2" on a real run — pin the exact tag, not
      # a major alias, every time this gets bumped.
      - uses: changesets/action@v2.1.0
        with:
          # `publish-script`, not `publish` — a real, breaking rename between v1 and
          # v2: v1.9.0's inputs were camelCase (`publish`, `setupGitUser`,
          # `createGithubReleases`, `commitMode`); v2 renamed to kebab-case
          # (`publish-script`, `create-github-releases`, `push-git-tags`, ...) and
          # dropped `publish` entirely — confirmed directly against v2.1.0's real
          # action.yml, not assumed from a README. A prior bump to v2.1.0 (dependency
          # PR) left this input at its old v1 name; the action FAILS LOUD on this —
          # not a silent skip — but the failure was still missed for 4 consecutive
          # release runs: `##[warning]Unexpected input(s) 'publish'` followed by a
          # real `##[error]` and non-zero exit, confirmed directly via `gh run view
          # --log-failed` on the actual failed runs, leaving package.json bumped on
          # main with nothing actually published to npm the whole time. `publish`
          # (old) is genuinely gone from v2's schema, not just renamed with a compat
          # alias — re-verify this comment's own input list against the action.yml
          # for whatever version this is next bumped to; a Dependabot bump PR does
          # NOT itself verify the `with:`/`env:` block still matches the new major's
          # real schema.
          publish-script: pnpm release
          # Mirrors the identical expression in `env.GITHUB_TOKEN` below, deliberately
          # — the action throws if `process.env.GITHUB_TOKEN` is set AND differs from
          # this `with: github-token:` input (confirmed directly against v2.1.0's own
          # bundled code). Today `RELEASE_GITHUB_TOKEN` isn't configured as a repo
          # secret, so both sides fall back to the same default and this can't yet
          # diverge — but leaving this input unset relies on that staying true; setting
          # it to the SAME expression here means the day `RELEASE_GITHUB_TOKEN` IS
          # added, this can never crash on a mismatch it would otherwise introduce.
          github-token: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          # A real PAT, not the default GITHUB_TOKEN: GitHub deliberately does not
          # trigger other workflows on pushes authenticated by the default token (an
          # infinite-loop guard) — so with it, the "Version Packages" PR this action
          # opens would silently never get build-test/bench/CodeQL checks. Confirmed
          # via Effect-TS/effect's own release workflow, which does the same for the
          # same documented reason. Falls back to the default token if the PAT secret
          # isn't configured yet, so this doesn't hard-fail before that's set up — the
          # release PR just won't self-check until it is.
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          # v1's `.npmrc`-from-`NPM_TOKEN` auto-write is GONE in v2 (confirmed by
          # grepping v2.1.0's real bundled dist/*.js: zero references to NPM_TOKEN or
          # .npmrc anywhere) — the upstream CHANGELOG states auth should move to
          # Trusted Publishing (OIDC) instead, which `id-token: write` above and
          # `publishConfig.provenance` in package.json are already positioned for, but
          # neither this repo nor this comment has independently CONFIRMED Trusted
          # Publishing is actually configured on the npm registry side for this
          # package — that's an npmjs.com-side setting, invisible from here. Left set
          # (harmless if genuinely unused) rather than removed, since removing it on
          # an unverified assumption risks breaking auth a different way. Do not treat
          # the `publish-script` fix alone as "the release pipeline is healed" —
          # confirm via a real `workflow_dispatch` run that gets PAST this step and
          # into an actual successful `npm publish`, not just past the input error.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # changesets/action's internal `git commit` (for the Version Packages bump)
          # triggers this repo's OWN pre-commit lefthook hook inside the runner (since
          # `pnpm install` above already wired it up via the `prepare` script) — and
          # `gitleaks` isn't on GitHub's hosted runner image, so that hook fails with
          # "gitleaks: not found", blocking the commit. Confirmed via a real failed run.
          # The auto-generated commit's content (package.json + CHANGELOG.md) is fully
          # mechanical, produced by changesets' own tooling from a PR that already
          # passed the real pre-commit/pre-push/CI gates before it was merged — there's
          # nothing here for lint/format/secret-scanning to usefully check.
          LEFTHOOK: 0
