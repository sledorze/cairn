name: Probe unprivileged userns support

# Manual-only diagnostic: does this repo's actual GitHub-hosted runner allow
# unprivileged user-namespace creation (the prerequisite for bubblewrap/unshare-based
# sandboxing, per issue #69)? Answers with real evidence instead of continued
# research/guessing. Not wired into `push`/`pull_request` — this is a one-shot probe,
# not a permanent CI gate; delete this workflow once #69 is resolved either way.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Real functional test — bubblewrap WITHOUT network namespace (our use case needs no network isolation)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          bwrap --version
          echo "=== bwrap --ro-bind / / --tmpfs /tmp --unshare-user --unshare-pid --unshare-uts --unshare-ipc --unshare-cgroup -- echo ok (no --unshare-net) ==="
          bwrap --ro-bind / / --tmpfs /tmp --unshare-user --unshare-pid --unshare-uts --unshare-ipc --unshare-cgroup -- echo ok \
            && echo "RESULT: bwrap (no net unshare) WORKS" \
            || echo "RESULT: bwrap (no net unshare) FAILS (exit $?)"
          echo "=== does the sandbox actually isolate a private /tmp? ==="
          echo host-file > /tmp/host-only-marker.txt
          bwrap --ro-bind / / --tmpfs /tmp --unshare-user --unshare-pid --unshare-uts --unshare-ipc --unshare-cgroup -- \
            sh -c 'test -f /tmp/host-only-marker.txt && echo "LEAK: sandbox sees the host file" || echo "ISOLATED: sandbox cannot see the host file"'
