# Lefthook - Git hooks manager (https://github.com/evilmartians/lefthook)
# Installed automatically via `pnpm prepare`. Skip once: git commit --no-verify.

pre-commit:
  parallel: true
  commands:
    # Prevent secrets from being committed
    gitleaks:
      glob: '*.{js,cjs,mjs,ts,tsx,json,yaml,yml,env,sh}'
      run: gitleaks protect --staged --no-banner

    # Lint Dockerfiles
    hadolint:
      glob: '**/Dockerfile*'
      run: hadolint {staged_files}

    # Lint + auto-fix TypeScript
    oxlint:
      glob: '*.{js,cjs,mjs,ts,tsx}'
      run: pnpm oxlint --fix {staged_files} && git add {staged_files}
      stage_fixed: true

    # Format + auto-fix
    prettier:
      glob: '*.{js,cjs,mjs,ts,tsx,json,md,yml,yaml,css,html}'
      run: pnpm prettier --write {staged_files} && git add {staged_files}
      stage_fixed: true

    # Docs: no dead links + every big file has a fresh, stamped summary
    #
    # `unset $(git rev-parse --local-env-vars)`: a linked git worktree gets GIT_DIR
    # (and, during this hook, GIT_INDEX_FILE) exported into hook subprocesses — see
    # src/io/gitEnv.ts. `pnpm check` itself already scrubs its own git calls, so this
    # is belt-and-braces against any spawner that doesn't (this hook line, a future
    # command added here); it does nothing for CI or a direct `pnpm check`.
    docs:
      glob: '*.md'
      run: unset $(git rev-parse --local-env-vars); pnpm check

# Check-only mirror (no auto-fix). Usage: lefthook run ci
ci:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks detect --no-banner
    hadolint:
      glob: '**/Dockerfile*'
      run: hadolint {all_files}
    oxlint:
      run: pnpm lint
    prettier:
      run: pnpm format:check
    docs:
      run: pnpm check

# The quality gate before code leaves your machine.
#
# Every command below is prefixed with `unset $(git rev-parse --local-env-vars)`: a
# linked git worktree gets GIT_DIR exported into pre-push hook subprocesses (see
# src/io/gitEnv.ts) — and `checks` is exactly the command that runs the integration
# tests whose real `git init`/`commit` fixture setup this incident corrupted. `pnpm
# test`/`pnpm check` scrub their own git calls already; this is belt-and-braces
# against any spawner (here or added later) that doesn't. Does nothing for CI or a
# direct `pnpm test` outside this hook.
pre-push:
  piped: true
  commands:
    # Issue #111: fails if a user-facing file changed (src/**, README.md — see
    # scripts/changeset-required-paths.regex) with no new .changeset/*.md in the
    # diff. Runs first — near-instant (a git diff + grep), so a missing
    # changeset fails fast instead of waiting on the expensive steps below.
    # Same shared-script-with-CI shape as `bench` further down.
    changeset:
      priority: 1
      run: ./scripts/check-changeset.sh
    checks:
      priority: 2
      run: unset $(git rev-parse --local-env-vars); pnpm typecheck && pnpm test && pnpm build
    # Coverage ratchet, local-only (not run in CI — see ci.yml, which calls
    # plain `pnpm test`): fails only if coverage regresses below the
    # thresholds committed in vitest.config.ts; autoUpdate means those
    # numbers self-raise as coverage improves, so this never needs manual
    # bumping to stay meaningful.
    coverage:
      priority: 3
      run: unset $(git rev-parse --local-env-vars); pnpm coverage
    docs:
      priority: 4
      run: unset $(git rev-parse --local-env-vars); pnpm check
    # Perf regression gate: only runs when a hot-path file changed (see
    # scripts/bench-guard.sh), comparing the push's base ref against HEAD in a
    # scratch worktree on this machine — a same-runner, back-to-back comparison
    # so the threshold can be tight without CI-noise false positives.
    bench:
      priority: 5
      run: ./scripts/bench-guard.sh
